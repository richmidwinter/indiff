[package]
name = "indiff"
version = "0.1.0"
edition = "2021"
description = "A diff that reviews the change"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
indiff-engine = { path = "../engine" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
