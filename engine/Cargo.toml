[package]
name = "indiff-engine"
version = "0.1.0"
edition = "2021"
description = "Review engine for indiff: diff parsing, context, model call and citation checks"
license = "MIT"

[lib]
name = "indiff_engine"

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
